# StockIA Platform (Open Source course) - common configuration
spring.application.name=stockia-platform
server.port=${PORT:8181}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Persistence: snake_case plural table names (SnakeCasePhysicalNamingStrategy) and UTC timestamps
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=com.databit.stockia.platform.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Internationalization: English by default, Spanish with Accept-Language: es
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.jackson.generator.write-bigdecimal-as-plain=true
spring.jackson.serialization.write-dates-as-timestamps=false

# OpenAPI documentation (Swagger UI at /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Security: JWT (HS256). Use a secret of at least 32 characters in production.
authorization.jwt.secret=${STOCKIA_JWT_SECRET:stockia-development-secret-change-me-0123456789}
authorization.jwt.expiration.days=${STOCKIA_JWT_EXPIRATION_DAYS:7}
stockia.cors.allowed-origins=${STOCKIA_CORS_ALLOWED_ORIGINS:http://localhost:4200,https://*.vercel.app}

# Restaurant business rules
stockia.restaurant.time-zone=America/Lima
stockia.iam.invitation-temporary-password=stockia123
stockia.iam.password-reset.reset-link-base-url=${STOCKIA_WEB_APP_URL:http://localhost:4200}
stockia.iam.password-reset.expose-simulated-email=${STOCKIA_EXPOSE_SIMULATED_EMAIL:true}
stockia.alerts.sweep-enabled=true
stockia.alerts.sweep-interval=PT1H
stockia.alerts.sweep-initial-delay=PT1M

# Machine Learning (ONNX model) and the third-party weather service (Open-Meteo)
stockia.ml.model-location=classpath:ml/
stockia.weather.enabled=${STOCKIA_WEATHER_ENABLED:true}
stockia.weather.forecast-url=https://api.open-meteo.com/v1/forecast

# Demo data (restaurant, users, supplies, recipes, 120 days of sales, alerts, first forecast)
stockia.seed.demo-data=${STOCKIA_SEED_DEMO_DATA:true}
stockia.version=@project.version@
