# Integration tests: in-memory H2, demo data, no external network calls and no background sweep
spring.datasource.url=jdbc:h2:mem:stockia-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
stockia.seed.demo-data=true
stockia.weather.enabled=false
stockia.alerts.sweep-enabled=false
authorization.jwt.secret=stockia-test-secret-0123456789-0123456789
